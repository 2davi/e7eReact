<!DOCTYPE html>
<meta charset="UTF-8">
<div id="disp"></div>
<script>
    const disp = document.querySelector("#disp");

    const members = [
        {name: "남혁", pos: "level1"},
        {name: "성화", pos: "level2"},
        {name: "규민", pos: "level3"},
        {name: "성운", pos: "level2"},
        {name: "수민", pos: "level3"}
    ];

    const position = {
        level1: "회장님",
        level2: "사장님",
        level3: "대장님"
    };

    let tblStr = `
        <table border=1 width=300>
        <tbody>
            <tr><th>이름</th><th>위치</th></tr>
        `;
    for(let i=0; i<members.length; i++){
        let member = members[i];
        tblStr += `
            <tr><th>${member.name}</th><th>${position[member.pos]}</th></tr>
        `;
    }
    tblStr += `</tbody></table>`;

    disp.innerHTML = tblStr;

</script>
