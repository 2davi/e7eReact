<!DOCTYPE html>
<meta charset="UTF-8">
<script>
    // 스크립트 인터프리터는 소괄호만 씌우면 바로 실행하려고 함.
    // 그냥 +, -, !만 앞에 붙여도 실행이 되는데, 표현식으로 여기기 때문.
    // └ 글타고 맘대로 쓰면 안 되고,, 약속이 있다. 관례적으로 오케이된 건 ()와 몽둥이!
    // 선언부에 이름 안 붙이고 소괄호 둘러쌈 => !익명함수가 됨 
    // 익명함수 뒤에 함수호출문법 사용 => !즉각실행함수가 됨

    // 보통 라이브러리 들에 1~2개씩 초기화 블록으로 들어있음
    // 라이브러리의 핵심코드를 블록화 할 때도 사용
    (function(pName) {
        alert(pName+" 범 중에 최고 학범, 배운 호랑이");
    })("성운");







    // 선언(declare) 과 표현식(expression, 보통 연산식)
    let aaa = 888 + 99 + 77;        //<-표현식, 연산의 결과가 1개의 값으로 저장!
    //수민(); // OK!
    //아린(); // NG!
    // 브라우저 內 자바스크립트는 인터프리터?, 컴파일?
    // 브라우저 업체들이 스크립트 성능향상을 위해서
    // 여러분 몰래 실행 선 선언부는 최상위로 올려버림
    // 멋진 말로 hoisting이라고 부름!, 그냥 상식으로 알아 둠!
    //■□■□■□■□ Web Assembly: 함수를 C언어로 컴파일하고 제어만 스크립트로..ㅡㅡ

    // 화살표 함수
    // 함수를 너무 많이 만들다 보니 개발자의 손목이 나감(비공식답변)
    // 콜백함수를 많이 쓰다보니 function(function) 가독성 이상해 보임
    
    // 기억보단 손에 익혀야 하는 케이스
    /*
    const merong = (pName) => {             <- 매개변수 하나일 때 소괄호 생략 가능
        return `${pName} 안농!`;            <- return문 하나일 때 중괄호 생략 가능
    }
    */
   // 아래 형태로 너무나 많이 씀, 짜증나는 건 이렇게 안 쓰면 무시.
   // 화살표 함수는 한 가지 문제가 있음, this제어
   // this가 제어가 안 되고, 그냥 상위객체를 가리키는 걸로 정해져있음
   // 함수 안에 this가 들어가야 되면, 그냥 function 키워드를 사용
    const merong = pName => `${pName} 안농!`;
    alert(merong("현정"));



    // 공식 함수 선언법
    function 수민(){
        alert("수민");
    }

    // = 오른쪽이 표현식으로 해석되어 버림. 익명 함수가 만들어져!
    // 함수만큼은 항상 const로 받는다. 덮어씌워짐을 방지하기 위해.
    const 아린 = function() { alert("아린"); };
    
    // 함수의 매개변수에는 제약사항이 있당? 제약사항은 없당. 어떤 타입이든 가능하당
    // 오버로딩 있당? 없당? => 없당
    // └ 자바에서는 오버로드된 메소드의 파라미터를 시그니처라고 부름

    //함수의 매개변수로 함수가 넘어왔을 때, 넘어온 함수를 callback 함수라 부름
    // └ 단지 뒤에 불린다 해서 붙여진 이름^ㅂ^
    // callback이 비동기쪽에서 결과 처리로 많이 쓰이다보니까
    // callback 자체가 비동기 함수라고 오해하는 경우가 허다함!
    function 찬영(pArg){
        pArg(); 
    }

    const sy = function(){
        alert("나 찬영일껄");
    }

    찬영(sy);

</script>
