<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<script>
// 자바스크립트에선 function 키워드가 자바의 class 키워드의 의미로도 쓰일 수 있다.
// 실제 class란 키워드가 추가되었지만,
// 내부적으로 function 키워드로 바뀌어 처리된다는 말에 잘 쓰는 사람들은
// 성능적 이유로 그냥 function 키워드를 활용함!

function Idol(name, song) {
    this.name = name;
    this.song = song;
    //class의 의미로 쓸 땐 이런 식의 코드가 가능

    // 메소드를 이렇게 선언하면 메모리가 낭비됨!,
    //■당근 전부 따로 가지면 성능이야 좋겠지만 아유
    this.insa = function() {
        alert(`안농 나 ${this.name}라고 행`);
    }
    
    
    return this;
    //function키워드를 클래스의 의미로 쓸 땐, return에 객체를 반환하는 것이 default!
}

//■ 그래서 prototype 속성을 이용. (인사라는 메소드를 공유해서 쓴다.)
// 보통 prototype에 만들어서 씀. Idol을 통해 만들어진 객체는 모두 이 메소드를 공유할 수 있다.
// 공유한다 == 참조한다.
Idol.prototype.insa2 = function() {
    alert(`안농 나는 ${this.name}라고 행`);
}

const roze  = new Idol("로제", "APT");
console.log("체크킁: ", roze); // 누느로 보아용!
const jenni = new Idol("제니", "solo");
//new 연산자가 빈 객체를 만들어주고, 그걸 function Idol의 `this`로 쓰기 시작한다.

roze.insa();
jenni.insa();

console.log(roze);
console.log(jenni);
</script>
</html>
