<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    .aa,.bb{cursor:pointer;}
</style>
</head>
<body>
<h1>sort활용 숙제</h1>
<table border="1" width="400"><thead>
	<tr>
		<th>순번</th>
		<th class="aa" onclick="fNameSort()">이름</th>
		<th class="bb" onclick="fAgeSort()">나이</th>
	</tr>
</thead><tbody>
	<tr><td>1</td><td>현석</td><td>50</td></tr>
	<tr><td>2</td><td>경덕</td><td>40</td></tr>
	<tr><td>3</td><td>현정</td><td>20</td></tr>
	<tr><td>4</td><td>성운</td><td>80</td></tr>
	<tr><td>5</td><td>아린</td><td>19</td></tr>
</tbody></table>
<script>
/* NodeList : 유사배열이라 부름(index와 length를 가짐)
	 Array.from은 내부에 아래와 같은 코드가 담김, 별 게 없음^Q^ */
function toArr(pObj) { //유사배열을 받아서, 스크립트 Array로 바꾸는 함수
	let newArr = [];
	for(let i=0; i<pObj.length; i++) {
		newArr.push(pObj[i]);
	}
	return newArr;
}

// const trs  = Array.from(document.querySelectorAll("tbody > tr"));
const trs = toArr(document.querySelectorAll("tbody > tr"));
const tbody= document.querySelector("tbody");
let isToggleName = false;
let isToggleAge = false;


function fNameSort() {

	// 가져온 trs를 먼저 정렬해야 함
	trs.sort((a,b) => {
    if(isToggleName){
      if(a.children[1].innerHTML > b.children[1].innerHTML) return 1;
      return -1;
    } else {
      if(a.children[1].innerHTML < b.children[1].innerHTML) return 1;
		  return -1;
    }
	});
  // 상태값을 변경한다.
  isToggleName = !isToggleName;
  // 정렬된 순서대로 append한다.
	for(let i=0; i<trs.length; i++) {
		tbody.appendChild(trs[i]);
	}
}

function fAgeSort() {
  trs.sort((a,b) => {
    if(isToggleAge){
      if(a.children[1].innerHTML > b.children[1].innerHTML) return 1;
      return -1;
    } else {
      if(a.children[1].innerHTML < b.children[1].innerHTML) return 1;
      return -1;
    }
  });
  isToggleAge = !isToggleAge;
  for(let i=0; i<trs.length; i++) {
    tbody.appendChild(trs[i]);
  }
}
</script>
</body></html>
