<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    .aa,.bb{cursor:pointer;}
</style>
</head>
<body>
<h1>sort활용 숙제</h1>
<table border="1" width="400"><thead>
	<tr>
		<th>순번</th>
		<th class="aa" onclick="fNameSort()">이름</th>
		<th class="bb" onclick="fAgeSort()">나이</th>
	</tr>
</thead><tbody>
	<tr><td>1</td><td>현석</td><td>50</td></tr>
	<tr><td>2</td><td>경덕</td><td>40</td></tr>
	<tr><td>3</td><td>현정</td><td>20</td></tr>
	<tr><td>4</td><td>성운</td><td>80</td></tr>
	<tr><td>5</td><td>아린</td><td>19</td></tr>
</tbody></table>
<script>
const tbody= document.querySelector("tbody");
const trs  = document.querySelectorAll("tbody > tr");
fNameAlign = false;
fAgeAlign = false;
function fNameSort() {
    let nameArr = [];
		for(let i=0; i<trs.length; i++) {
			nameArr[i] = trs[i];
		}
		nameArr.sort(function(a, b) {
				aName = a.children[1].textContent;
				bName = b.children[1].textContent;
				if(!fNameAlign) {
					if(aName > bName) return 1;	else return -1;
				} else {
					if(aName < bName) return 1; else return -1;
				}
		});
		for(let i=0; i<trs.length; i++){
        tbody.appendChild(nameArr[i]);
    }
    fNameAlign = !fNameAlign;
}
function fAgeSort() {
    let ageArr = [];
		for (let i=0; i<trs.length; i++) {
			ageArr[i] = trs[i];
		}
		ageArr.sort(function(a,b) {
			aAge = a.children[2].textContent;
			bAge = b.children[2].textContent;
      if(!fAgeAlign) {
        if(aAge > bAge) return 1; else return -1;
      } else {
        if(aAge < bAge) return 1; else return -1;
      }
		});
		for(let i=0; i<trs.length; i++){
			tbody.appendChild(ageArr[i]);
		}
    fAgeAlign = !fAgeAlign;
}
</script>
</body></html>
