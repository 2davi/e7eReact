<!DOCTYPE html>

<!-- 배열에 자주쓰는 중요 메소드를 만들어봅시다. feat.call-back -->
<script>

function Arin() {       //<+=Arin은 내맘대로 배열임
    this.length = 0;
}
Arin.prototype.push = function(pArg) {
    this[this.length] = pArg;
    this.length++;
    return this;
}
//forEach; callback 사용
Arin.prototype.forEach = function(cb) {
    for(let i=0; i<this.length; i++) {
        cb(this[i], i);
    }
    return this;
}
//map; 이건 특히 프론트 프레임워크에서 엄청나게 미친듯이 많이 씀!
//내가 받은 빅데이터를 내가 원하는 형태로 전처리하기 위해 쓰이는 메소드 map.
// .map()은 항상 새로운 배열을 반환하게 되어있음!
Arin.prototype.map = function(cb) {
    let newArr = [];    // 새로 만든 배열을 return 할 준비
    for(let i=0; i<this.length; i++) {
        newArr[i] = cb(this[i], i);     // newArr.push(cb(this[i], i)); newArr을 Arin()으로 만들 때.
    }
    return newArr;
}
//filter; 이것도 미친듯이 많이 씀, 골라내기!
Arin.prototype.filter = function(cb) {
    let newArr = [];
    for(let i=0; i<this.length; i++) {
        if(cb(this[i], i)) {  //※※CALL-BACK 함수가 TRUE를 RETURN했을 때에만..!
            newArr.push(this[i]);
        }
    }
    return newArr;
}

//sort; map이나 filter보단 빈도가 적으나, 꽤나 자주 쓰임! 유용
Arin.prototype.sort = function(cb) {
    for(let j=0; j<this.length; j++) {
        for(let i=j+1; i<this.length; i++) {
      //┌─←─if( this[j] > this[i] ) {
      /*└→*/if( cb(this[j], this[i]) >0 ) {
                let temp = this[j];
                this[j] = this[i];
                this[i] = temp;
            }
        }
    }
}
