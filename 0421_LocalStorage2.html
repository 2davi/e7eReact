<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<script>
/*  LocalStorage의 제약사항 (기억해야 함! 객체를 직접 저장하지는 못함)
    localStorage에는 문자열만 저장 가능.
    문자열화해서 저장해야 함! (당연한 이야기, 객체를 저장하려면 serialization(문자열화))
*/
//alert(["현정", "만세"].toString());
// 배열의 toString() 메소드에 눈속임 당할 수 있음.

// JSON({},[]) 을 저장할 때는 꼭 문자열 화(Serialize)가 필요하다.
localStorage.setItem("hjInfo", JSON.stringify({name:"현정", age:"20"})); //object, Object
localStorage.setItem("gdInfo", JSON.stringify(["경덕", "만세"]));

// 읽기, 원래대로 돌려줘야 함 JSON.parse(re-Serialize)
let hjName = JSON.parse(localStorage.getItem("hjInfo")).name;
let hjAge  = JSON.parse(localStorage.getItem("hjInfo")).age;
console.log(hjName, ", ", hjAge);


localStorage.clear();
//■
let dummyArr = [];
for(let i=0; i<10; i++) {
  let member = {
    mid: (i+1),
    name: `멤바 ${i+1}`,
    alias: `누구닝 ${i+1}`
  }
  dummyArr.push(member);
}
localStorage.setItem("memTable", JSON.stringify(dummyArr));

// 테스트 mid:9의 name을 성화로, alias를 왜 이렇게 성화야로 바꾸삼
// 코드 작성!
let members = JSON.parse(localStorage.getItem("memTable"));

for(let i=0; i<members.length; i++) {
  if(members[i].mid==9) {
    members[i].name = "성화";
    members[i].alias= "왜 이렇게 성화야";
    break;  //더 이상 할 거 없음.
  }
}
//메모리상의 데이터를 다시 hdd에 저장
localStorage.setItem("memTable", JSON.stringify(members));


let newMembers = members.map((member)=>{
  if(member.mid==8) {
    member.name = "아린";
    member.alias= "왜 이렇게 무릎이 아린가?";
  }
  return member;
});
localStorage.setItem("memTable", JSON.stringify(newMembers));
</script>
</html>
