    // jQuery Ajax 모양의 탄생!  -> 별거 없음, 그저 매개변수 처리와 , 네임스페이스 처리
    // 자바스크립트에서 변수명으로 쓸 수 있는 특수문자는(2개)? _, $

    const $ = {};  // 여기선 일부러 빈객체로, 네임스페이스용

    // 3단계 변형, 네임스페이스(현실에 비유하면 브랜드명 또는 지역명.고유) 주기  //충돌(로인한 덮어쓰기)방지, 디렉토리임
    $.ajax = function(pOpt){      // pOpt는 {}로 받을 것임        
        let xhr = new XMLHttpRequest();
        xhr.open(pOpt.method, pOpt.url, pOpt.async);
        xhr.onload = ()=>{
            if(pOpt.dataType == "json"){
                pOpt.success(JSON.parse(xhr.responseText));  // 함수 호출
            }else{
                pOpt.success(xhr.responseText);  // 함수 호출
            }
            //pOpt에 전부 담아 보냈기 때문에 pOpt에서 꺼내야 
            //pOpt.으로 꺼내거나, 배열식접근법(대괄호[]이용)
            //console.log("받은 결과 ", xhr.responseText);
            // 결과를 받아서 처리하는 부분
            // 여기서 함수명(xhr.responseText) 이런식으로 처리한다면 좋을 듯
        }
        xhr.send();
    }
