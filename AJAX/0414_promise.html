<!DOCTYPE html>
<meta charset="UTF-8">
<script>
    // 안에 콜백안에 콜백 형태가
    // 대규모 프로젝트에서 발생했는데  이걸 멋진말로 (Hell of Callback)
    // Promise 는 bluebird란 회사가 이 형태를 조금 더 보기 좋게 만들어 준 것뿐
    // 처음 보면 콜백 때문에 머리가 낯설어
    // 잘 실행된 상태 resolved,  깨진상태 reject,  약속까지의 시간 pending

    // Promise를 직접 만들 일은 잘 없음
    // 잘하는 사람들은 이걸 가지고, 비동기 시뮬레이션 형태로 많이 씀(가짜코드 만들어서)
    // B/E(백엔드)가 있는 것처럼(더미 데이터 가져오는거다) 
    //굳이 백엔드 만들지않고도 클라이언트만 가지고도 있는것처럼 할수있어(res,rej만 잘 넣으면, 그거 빼곤 껍데기여)
    // 몇 번 봐서 일단 눈에는 거부감이 없도록 해야 함!

    const axios = {};  // 네임스페이스용 빈 객체
    // 메소드 선언
    axios.get = function(url){
        return new Promise((res, rej)=>{
            // 이 안에 비동기 코드가 들어와야 함
            let xhr = new XMLHttpRequest();
            xhr.open("get",url,true);
            xhr.onload = ()=>{
                // 비동기 성공
                res(xhr.responseText);
            }
            xhr.send();  //ajax실행 안시키면 안나와~~
            //res("성공이당");  // 약속(비동기)이 잘 지켜졌을때
            //rej("실패얌");
        })
    }

    // 실제 사용은 형태가 간단해짐 (axios 만들어두면 원하는 거에 그냥 쓰면돼)
    axios.get("0414_data.json").then(rslt => console.log("(34)체킁: ", rslt));
    axios.get("0411_data.txt").then(rslt => console.log("(35)체킁: ", rslt));

    /* Promise 사용법 -- 자주 봐서 꼭 눈에 익히기! 그래야 씀! 리액트 기초!
    fCk().then(rslt=>{ console.log("결과1는 ", rslt)})
         .catch(err=>{ console.log("결과2는 ", err)} )
         .finally(()=>{
            console.log("무조건 실행");
         })
    */

</script>
