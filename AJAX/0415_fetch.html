<!DOCTYPE html>
<meta charset="UTF-8">
<style>
    #regFrd{
        text-align: center;
        border: 1px solid blueviolet;
        margin-bottom: 5px;
        display: none;
    }
</style>
<div id="regFrd">
    이름: <input type="text" name="" id="fName" value=""><br>
    나이: <input type="number" name="" id="fAge" value="21" max="99" min="20">
    <button onclick="fReg(this)">진짜 등록 ^ㅂ^</button>
    <button onclick="fUp(this)"> 수정</button>
    <button onclick="fDel(this)">삭제</button>
</div>
<button onclick="fNew()">새 친구 등록 ^0^</button>  <!--<+=this 넘겨주기-->
<div id="merong"></div>
<script>
    // fetch 꼭 손으로 직접 쓸 수 있을 정도로 연습해야 함.
    // 손으로 직접 쓸 수 있을 정도 되어야, 한동안 안 해도 잔상으로 찾아서 할 수 있음.

    const regFrd = document.querySelector("#regFrd");
    function fNew() {
        regFrd.style.display = "block";
    }
    function fReg(pThis) {
        console.log("체킁: ", pThis);
        //일부러 돌려서 찾기.. 그냥 참고용으로 ㅗ^ㅂ^ㅗ
        let rF = pThis.closest("div");  //<--가장 가까운 부모속성 찾기 .closest("")
        let name = rF.querySelector("#fName").value;
        let age  = rF.querySelector("#fAge").value;

        let newFriend = JSON.stringify({ name, age });
        fetch("http://localhost:9999/api/friends", {
            method: "POST",
            headers: {
                "Content-type": "application/json;",
            },
            body: newFriend  //<-값 보내는 겅
        }).then(resp=>{
            resp.text().then(rslt=>{
                console.log("체킁: ", rslt);
                if(rslt=="success"){
                    getList();
                    rF.style.display = "none";
                    let name = rF.querySelector("#fName").value = "홍길동";
                    let age  = rF.querySelector("#fAge").value = "21";
                }
            });
        });
    };
    //fetch 또는 axios, 둘 중 한 개는 완벽히 다룰 수 있어야 함!
    //fetch는 설치없이 그냥 쓸 수 있고, axios는 외부 라이브러리라서 설치해서 써야 함
    //편하기는 axios가 더 편한데, 폐쇄망이라면 어쩔 수 없이 fetch 사용!

    //fetch GET방식! 불편한 점은 then을 두 번 써야 서버로부터의 결과를 확인 가능!
    const merong = document.querySelector("#merong");
    /*
    Access to fetch at 'http://ddit.or.kr/' from origin 'http://192.168.34.81:5500'
    has been blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present
    on the requested resource. If an opaque response serves your needs, set the
    request's mode to 'no-cors' to fetch the resource with CORS disabled.
    ->브라우저 요청 OK, but AJAX 요청 NG!!

    // ^ㅂ^ CORS Policy가 멉니깡?
    [[ CORS: CROSS ORIGIN RESOURCE SHARING ]]
    Same Origin Policy: cross origin 요청을 기본적으로 제한하는 정책
    origin::http://ddit.or.kr:80 웹 주소는 기본적으로 포트번호:80을 숨겨놓음
        프로토콜 + 도메인명(서버명) + 포트번호    <== ORIGIN 3 요소.
    위 요소 중 하나라도 다르면 서로 다른 origin이다... ==서로 다른 도메인으로 정의.
    한 도메인에서 다른 도메인으로 리소스나 그 처리를 요청하는 것
     --html페이지가 자신이 온 오리진에 요청하지 않고, 다른 오리진에 요청하는 것을
       cross origin 요청이라 하고, 기본적(서버세팅으로 들어올 수 있음)으로 막혀있음.
    AJAX는 기본적으로 요청 데이터를 변수로 받음. 가공처리에 매우 용이. 그래서 막음.
    서버관리자에 의해 누구는 풀어주고, 누구는 막는 것도 가능!
    [서버우회] CORS 해결책. 
        └ 누가 달라고 하는지 알 때는 default로 OK. 이도 서버관리자가 막을 수 있음.
    */


    let hbFriend = JSON.stringify({age:100});
//디버깅이란 결국 쫓아다니면서 해당 과정에서 제대로 처리했는지 일일이 확인하는 과정.
function fDel(pBtn) {
    let rF = pBtn.closest("div");  //<--가장 가까운 부모속성 찾기 .closest("")
    let name = rF.querySelector("#fName").value;

    fetch(`http://localhost:9999/api/friends/${name}`, {
        method: "delete"
    }).then(resp=>{
        resp.text().then(rslt=>{
            console.log("체킁: ", rslt);
        });
    });
    getList();
}
function fUp(pBtn) {
    let rF = pBtn.closest("div");  //<--가장 가까운 부모속성 찾기 .closest("")
    let name = rF.querySelector("#fName").value;
    let age  = rF.querySelector("#fAge").value;

    let hbFriend = JSON.stringify({ name, age });

    fetch(`http://localhost:9999/api/friends/${name}`, {
        method: "PUT",
        headers: {
            "Content-type": "application/json;"
        },
        body: hbFriend  //<-값 보내는 겅
    }).then(resp=>{
        resp.text().then(rslt=>{
            console.log("체킁: ", rslt);
            // if문은 그냥 생략 때려버림^0^ 원래는 여기 있어야 해!!
            getList();  // 리스트 재호출.
        });
    });

}
function fClick(pTr) {
    //let name = pTr.children[1].innerHTML;
    //let age = pTr.children[2].innerHTML;
    ////아래는 변칙이지만 유용! 아주 있어보임
    //let name = pTr.querySelector("[tasu]").innerHTML;
    //let age  = pTr.querySelector("[cmin]").innerHTML;
    ////data-를 이용한 값 전달(정확히는 값을 태그객체에 심어놓은 것임)
    let name = pTr.dataset.myName;
    let age  = pTr.dataset.myAge;
    console.log("체킁: ", name, age);

    //css 선택자 속성을 이용하는 건 개발자들이 아주 많이 사용!
    regFrd.querySelector("[type=text]").value = name;
    regFrd.querySelector("[type=number]").value = age;
    regFrd.style.display = "block";
}
function fOver(pTr) {
    //console.log("눈으로 확인! ", pTr);
    pTr.style.backgroundColor = "black";
    pTr.style.color = "yellow";
}
function fOut(pTr) {
    //console.log("눈으로 확인! ", pTr);
    pTr.style.backgroundColor = "";
    pTr.style.color = "";
}
function getList() {
    //merong.innerHTML += "<h1>학범 만세</h1>";
    // GET 방식 -리스트
    fetch("http://localhost:9999/api/friends").then(response => {   //.then의 결과를 밖으로 뽑을 수 없음.
        response.json().then(rslt => {          //단순문자면 .text(), 필요하면 .json()
            console.log("결과 체킁: ", rslt);   //text변수로 데이터를 옮겨 빼놔야 함!
            //merong.innerHTML = rslt;            //피싱 사이트 뚞딲^0^
            let tblStr = `
                <table border="2" width="300" style="text-align:center;">
                    <tr><th>순번</th><th>이름</th><th>나이</th></tr>
                    <tbody>`;
// 어떤 함수든 매개변수로 this를 쓰면, 그 태그 요소를 불러온다.
            for(let i=0; i<rslt.length; i++){
                let frd = rslt[i];
                tblStr +=`
                    <tr data-my-name=${frd.name} data-my-age=${frd.age} onclick="fClick(this)" onmouseover="fOver(this)" onmouseout="fOut(this)">
                        <td>${i+1}</td>
                        <td tasu>${frd.name}</td>
                        <td cmin>${frd.age}</td>
                    </tr>`;
// 사용자 정의 속성: data- ==> 이 값들은 해당 태그의 dataset Property에 들어있음.
            }
            tblStr += `</tbody></table>`;
            merong.innerHTML = tblStr;
        });
    });
};
