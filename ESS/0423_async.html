<!DOCTYPE html>
<meta charset="utf-8">
<script>
/*
  Promise로 개발자의 불만을 잠시 잠재우는 게 가능했지만
  콜백지옥이란 말이 then의 지옥이란 말로 바뀜.
  더 나은 해결책이 필요해짐!!
  aync / await 이건 칭찬을 엄청 많이 받았고, 지금은 권장 코딩 방식
*/


  let dummyArr = [
    {name:"예솔", age:20, merit:"에너지"},
    {name:"윤석", age:30, merit:"관심없엉"},
    {name:"상윤", age:40, merit:"잘생겼어"},
    {name:"찬영", age:50, merit:"어림없어"},
    {name:"태규", age:19, merit:"봉태규아님"}
  ];

//비동기 페이크 코드 => setTimeout(함수, 시간);
//setTimeout이 비동기로 동작하기 때문에 주로 이용
  function getData() {
    let ranTime = Math.round(Math.random()*2000) + 1000;
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        resolve(dummyArr);  //<-무조건 잘 된 상황
      }, ranTime);
    });
  }

//기존 Promise 호출 방식 then/catch/finally
  getData().then(rslt => {
    console.log("체킁: ", rslt);
  });

//then vs async
//async/await 는 쓰려면 무조건 함수를 만들어야 함 (간단한 경우 귀찮음)
//간단한 경우는 그냥 then을 씀!
//꼭 자주 써보도록 해야 함!

//async/awwait 방식으로 변환
//async와 await는 세트다. await는 async함수 내의 top-level에서만 사용할 수 있다.
//비동기인데, 흐름이 동기식으로 보여서 개발자들의 칭찬이 쏟아짐!
/*
  async function fAsync() {
    alert("수민일 괴롭히장");
    let rslt = await getData();  //await 뒤에는 Promise가 와야 함!
    alert("상진인 술에 약함");
    console.log("좋당: ", rslt); //await 덕분에 코드 흐름이 동기식으로 보임 ^ㅂ^!
  }

  fAsync();
  alert("상진이 띠엄띠엄 추억으로");
*/

//async 함수는 무조건 return 타입이 Promise당!!!
//우리가 아는 function의 return과 다르니, 머리에 기억합시다 (예외사항)
  async function fAsync2() {
    let rslt = await getData();  //await 뒤에는 Promise가 와야 함!

    //가능하면 async함수 안에서 단위 업무작업을 종료하는 것이 좋음
    //return해서 다른 곳에서 사용하기 시작하면 시점이 엇갈리고, 머리가 아프기 시작!

    return rslt; // 여기에 속으면 안 됨! 이 녀석은 프로미스임.
  }

  console.log("누느로 확인: ", fAsync2());

  fAsync2().then(merong => {
    console.log("체킁: ", merong);
  });

</script>
