<body>
  <input type="text" fbi value="흥">
  <input type="text" fbi value="치">

  <hr>
  <div class="hjl">현</div>

<script type="text/javascript">
/*
  jQuery 간략버전으로 만들어보깅
  jQuery는 callback을 잘 활용한 좋은 라이브러리
  좋은 jQuery 플러그인이 많아서 완전히 사라지기는 쉽지 않을 듯
  jQuery 개발팀도 계속 jQuery 버전 업 활동을 하겠다고 발표함
*/

// new를 없애기 위해서 new를 넣어서 호출해주는 ㅎ마수를 만듦,
// 보통 팩토리 패턴이라 부름

(function() { //<-- 즉각 실행 함수:: 핵심코드도 지킴.
  function $(cssSel) {
    return new GetDOM(cssSel);
  }
console.log($("[fbi]"));
//class로 쓸 것임 ^ㅂ^
  function GetDOM(cssSel) {
    const elems = document.querySelectorAll(cssSel); //단순 실행 코드

    // 옮겨 담기(참조방식)
    this.length = elems.length;
    for(let i=0; i<elems.length; i++) {
      this[i] = elems[i];
    }
    this.cssSel = cssSel;
    this.start = this;
    return this; //이게 생략됨!
  }

//메소드를 누구나 추가해서 쓸 수 있도록 해주고 싶었음
//멋진 말로 jQuery 플러그인 개발! 이라 부름
//  GetDOM.prototype.메소드명 = function() {};
//그럴려면 GetDOM.prototype을 즉각실행함수 밖에서 접근할 수 있어야 함
//  $.fn = GetDOM.prototype;
//원하는 메소드를 추가해서 사용하기만 하면 됨!
  window.$ = $;
  $.fn = GetDOM.prototype;
})();

console.log("체에킁: ", $.fn);
//메소드 추가
//innerHTML 속성만을 다루는 html 메소드 추가
//찬영이 별명 => 또자?
//스크립트에는 오버로딩이 없음
//읽기, 전부쓰기, 부분조작(콜백)
$.fn.html = function(pArg) {
  //매개변수가 넘어오지 않았을 때, 읽기
  if(!pArg) {
    return this[0].innerHTML;
  }
  //전부 쓰기
  if(typeof(pArg)==="string") {
    for(let i=0; i<this.length; i++) {
      this[i].innerHTML = pArg;
    }
    return this; //메소드 체인닝!!
  }
  //매개변수가 콜백 함수일 떄, 부분조작
  if(typeof(pArg) === "function") {
    for(let i=0; i<this.length; i++){
      this[i].innerHTML = pArg.call(this[i], i, this[i].innerHTML);
    }
    return this; //메소드 체인닝!
  }
}

//style을 제어하는 css 메소드
  $.fn.css = function(pArg1, pArg2) {
    //읽기
    if(!pArg2) {
      return this[0].style[pArg1];
    }
    //전부쓰기
    if(typeof(pArg2) ==="string"){
      for(let i=0; i<this.length; i++) {
        this[i].style[pArg1] = pArg2;
      }
      return this;  //메소드 체인닝!
    }
    //부분조작
    if(typeof(pArg2) ==="function"){
      for(let i=0; i<this.length; i++) {
        this[i].style[pArg1] = pArg2.call(this[i], i, this[i].style[pArg1]);
      }
      return this;  //메소드 체인닝!
    }
  }

//value 속성만을 전용으로 제어하는 메소드
  $.fn.val = function(pArg) {
    if(!pArg) {
      return this[0].value;
    }
    
    if(typeof(pArg)==="string") {
      for(let i=0; i<this.length; i++) {
        this[i].value = pArg;
      }
      return this;
    }
    if(typeof(pArg)==="function") {
      for(let i=0; i<this.length; i++) {
        this[i].value = pArg.call(this, i, this.value);
      }
      return this;
    }
  }

// 이벤트 등록 on 메소드 구현
  $.fn.on = function(eName, eHandle) {
    for (let i=0; i < this.length; i++) {
      this[i].addEventListener(eName, eHandle.bind(this[i]));
    }
    return this; // 메소드 체이닝
  };

//■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□
//생각해 볼 과제
  $.fn.eq = function(pIndex) {
    //return this[pIndex]; **이러면 뒤에 val()을 못 써...
    //this[pIndex]만 남기고 나머진 지워버린 박스가 필요.
    this[0] = this[pIndex];
    for(let i=1; i<this.length; i++) {
      delete this[i];
    }
    this.length = 1;
    return this;
  }
  console.log( $("[fbi]").eq(1).value); //**끔찍한 혼종 탄생...ㄷㄷ
  console.log( $("[fbi]").eq(1).val());
  
//■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□
//진짜 과제 END 구현!!!!!
$.fn.end = function() {
  // 작성, 다시 처음 선택으로 돌아감
  // 수단과 방법을 가리지 않고 해봅니당. 안 되도 괜찮음.
  /*
    힌트 크게 2가지로 생각해 볼 수 있음
    이전 선택된 거 전부를 게속 가지고 있거나
    css 선택자만 가지고 있다가 호출 시에 다시 생성해주는 거!
  */

  // 규모의 문제라고 부름, 최적화 작업(속된 말로 '쥐어짠다')
  // 새로운 객체가 생기지 않게 하려면 querySelectorAll()해서 다시 this에 담아주는게 맞음!

  let ran = Math.round(Math.random()* 1);
  console.log(ran);
  if(ran) return /*$(this.start.cssSel);*/this.start;
  else return $(this.cssSel);
}
//■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□■□


/*
  jQuery를 잘못 쓰는 대표적 케이스
    똑같은 걸 특별한 이유 없이 계속 생성...
  $(".hjl")..... 같은 녀석을 계속 호출하면서 메모리 낭비시키기.
  ==> 여러번 쓸 거면 변수로 받아라.
      const ys = $(".hjl");
*/
//let hjls = new GetDOM(".hjl");
  let $hjls = $(".hjl")
  let $fbis = $("[fbi]");
  console.log("체킁: ", $hjls);
//alert($(".hjl").html());   //<-읽기
//$(".hjl").html("찬영 자?"); //<-전부 쓰기
  $hjls.html(function(idx, ihtml){ //<-부분조작(callback 사용...)
    console.log("체로롱: ", this.innerHTML);  //???
    if(idx===1) {
      return `메롱 ${ihtml}`;
    }
    return ihtml;
  });
  $hjls
    .css("color", "magenta") //<-전부쓰기
    .css("background-color", "yellow")
    .html((idx,val) => {
      if(idx===3) return `안농 ${val}`;
      return `아니양 ${val}`;
    })
    .css("color", (idx, val) => {
      if(idx===0) return "black";
      return val;
  });
  $fbis
    .val("경석 만세")
    .val((idx, value) => {
      if(idx===1) return "경덕 안 만세";
      return "누구냥 넌?";
    });
  $fbis.on("click", function() {
    console.log("눌렀닝: ", this);
  });
  $fbis.eq(1).val("상윤 안 정상?").css("color", "darkred");
  //$fbis.eq(1).end(); //??
  
  console.log($fbis.eq(1).end());
</script>
